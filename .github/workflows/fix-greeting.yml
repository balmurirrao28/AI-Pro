name: Fix ScheduleAI greeting
on:
  push:
    paths:
      - 'app.py'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update greeting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = '''<strong>Hi! I’m ScheduleAI.</strong><span>I will not create an event until the required details are collected. Say <b>“add schedule”</b> to start the guided flow.</span>'''
          new = '''<strong>Hi! I’m your ScheduleAI 👋</strong><span>I’m here to help you remember your schedule and schedule your work. You can ask me about your events, add or move schedules, check your free time, or use your voice.</span>'''
          if old not in s:
              raise SystemExit('Greeting text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit greeting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Update ScheduleAI welcome message'
          git push
